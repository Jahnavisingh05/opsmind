<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OpsMind — Incident Investigation Dashboard</title>
<style>
  :root {
    --bg: #0b0f19; --panel: #131a2a; --border: #232c40;
    --text: #e6e9f2; --muted: #8a93a8;
    --red: #ef4444; --yellow: #eab308; --green: #22c55e; --blue: #3b82f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .value.red { color: var(--red); } .value.green { color: var(--green); } .value.yellow { color: var(--yellow); }
  h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 12px; }
  .incident-list { display: flex; flex-direction: column; gap: 10px; }
  .incident-row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px;
                  display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .incident-row:hover { border-color: var(--blue); }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.OPEN { background: rgba(239,68,68,.15); color: var(--red); }
  .badge.RESOLVED { background: rgba(34,197,94,.15); color: var(--green); }
  .conf { font-weight: 700; }
  .empty { color: var(--muted); padding: 20px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 720px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .chain .step { background: #1b2436; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .chain .arrow { color: var(--muted); }
  .cand { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .cand ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
  .timeline-item { font-size: 13px; color: var(--muted); padding: 4px 0; }
  .ai-box { background: #0f1524; border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-top: 10px; }
  .close-btn { float: right; cursor: pointer; color: var(--muted); font-size: 20px; }
  .steps li { margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>OpsMind</h1>
    <div class="sub">AI Incident Investigation &amp; Root-Cause Analysis</div>
  </div>
  <div class="sub" id="last-updated">—</div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <h2>Active &amp; Recent Incidents</h2>
  <div class="incident-list" id="incident-list"><div class="empty">Loading…</div></div>
</main>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const API = `http://${window.location.hostname}:8088`;

async function j(url) {
  const r = await fetch(url);
  return r.json();
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString();
}

async function refreshOverview() {
  const o = await j(`${API}/api/overview`);
  const cards = document.getElementById('cards');
  cards.innerHTML = `
    <div class="card"><div class="label">Active Incidents</div>
      <div class="value ${o.active_incidents > 0 ? 'red' : 'green'}">${o.active_incidents}</div></div>
    <div class="card"><div class="label">Services Reporting</div>
      <div class="value">${o.services}</div></div>
    <div class="card"><div class="label">Error Rate (2m avg)</div>
      <div class="value ${o.error_rate_pct > 5 ? 'red' : 'green'}">${o.error_rate_pct}%</div></div>
    <div class="card"><div class="label">System Health</div>
      <div class="value ${o.system_health_pct < 70 ? 'yellow' : 'green'}">${o.system_health_pct}%</div></div>
  `;
}

async function refreshIncidents() {
  const incidents = await j(`${API}/api/incidents?limit=20`);
  const el = document.getElementById('incident-list');
  if (!incidents.length) {
    el.innerHTML = '<div class="empty">No incidents yet — traffic generator warms up the stack, then injects scenarios every couple of minutes.</div>';
    return;
  }
  el.innerHTML = incidents.map(inc => `
    <div class="incident-row" onclick="openIncident(${inc.id})">
      <div>
        <span class="badge ${inc.status}">${inc.status}</span>
        &nbsp; <strong>#${inc.id}</strong> — root cause: <strong>${inc.root_cause_service || '?'}</strong>
        <div class="sub" style="color:var(--muted); font-size:12px; margin-top:4px;">
          started ${fmtTime(inc.started_at)} · detected ${fmtTime(inc.detected_at)}
        </div>
      </div>
      <div class="conf">${inc.confidence ?? '—'}%</div>
    </div>
  `).join('');
}

async function openIncident(id) {
  const data = await j(`${API}/api/incidents/${id}`);
  const inc = data.incident;
  const modal = document.getElementById('modal-content');

  const chain = data.candidates.slice(0, 4).map(c => c.candidate_cause);
  const chainHtml = chain.map((c, i) =>
    `<div class="step">${c}</div>` + (i < chain.length - 1 ? '<div class="arrow">→</div>' : '')
  ).join('');

  const candHtml = data.candidates.map(c => `
    <div class="cand">
      <div style="flex:1">
        <strong>${c.candidate_cause}</strong>
        <ul>${(c.evidence || []).map(e => `<li>${e}</li>`).join('')}</ul>
      </div>
      <div class="conf">${(c.score * 100).toFixed(0)}%</div>
    </div>
  `).join('');

  const timelineHtml = data.timeline.map(t =>
    `<div class="timeline-item">${fmtTime(t.ts)} — ${t.label}</div>`
  ).join('');

  const stepsHtml = (inc.ai_investigation_steps || []).map(s => `<li>${s}</li>`).join('');

  modal.innerHTML = `
    <span class="close-btn" onclick="closeModal()">✕</span>
    <h3>🔴 Incident #${inc.id} <span class="badge ${inc.status}">${inc.status}</span></h3>
    <div class="sub">Started ${new Date(inc.started_at).toLocaleString()} · Confidence <strong>${inc.confidence}%</strong></div>

    <h4>Root Cause Chain</h4>
    <div class="chain">${chainHtml}</div>

    <h4>Candidate Causes (ranked)</h4>
    ${candHtml}

    <h4>Timeline</h4>
    ${timelineHtml}

    <h4>AI Report</h4>
    <div class="ai-box">
      <p>${inc.ai_summary || 'Generating…'}</p>
      <ul class="steps">${stepsHtml}</ul>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}
document.getElementById('modal-bg').addEventListener('click', (e) => {
  if (e.target.id === 'modal-bg') closeModal();
});

async function tick() {
  try {
    await refreshOverview();
    await refreshIncidents();
    document.getElementById('last-updated').innerText = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('last-updated').innerText = 'Connection error — is api-gateway running?';
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
